server:
  port: 8002

spring:
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            trusted:
              packages: com.vishalprasanna11.productcommandservice.dto,com.vishalprasanna11.productqueryservice.dto
            type:
              mapping: com.vishalprasanna11.productcommandservice.dto.ProductEvent:com.vishalprasanna11.productqueryservice.dto.ProductEvent
            value:
              default:
                type: com.vishalprasanna11.productqueryservice.dto.ProductEvent